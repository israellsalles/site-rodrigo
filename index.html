    <meta name="twitter:card" content="summary" />

      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <div class="logo">
          <img
            class="logo-img"
            src="assets/logo-medaberel.png"
            alt="Igreja Batista Medaberel"
          />
        </div>
        <p class="hero-kicker">DEUS QUE FALA</p>
        <h1 class="hero-title">IGREJA BATISTA MEDABEREL</h1>
        <p class="hero-locale">Um Ministério de Família</p>

        <div class="socials">
          <a
            class="social instagram"
            href="https://www.instagram.com/ibmcabula6"
            aria-label="Instagram"
          >
            <img
              src="https://cdn.simpleicons.org/instagram/ffffff"
              alt=""
            />
          </a>
          <a
            class="social youtube"
            href="https://www.youtube.com/@medaberelcabulavi"
            aria-label="YouTube"
          >
            <img
              src="https://cdn.simpleicons.org/youtube/ffffff"
              alt=""
            />
          </a>
          <a
            class="social whatsapp"
            href="https://wa.me/557188227813"
            aria-label="WhatsApp"
          >
            <img
              src="https://cdn.simpleicons.org/whatsapp/ffffff"
              alt=""
            />
          </a>
        </div>
        <p class="welcome">BEM VINDO (A)</p>
        <p class="map-title">Nosso endereco</p>
        <div class="map-embed">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6429.851512667393!2d-38.4418037!3d-12.9533965!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x7161a61c11bdeb5%3A0x92b91b4c00cd50c1!2sIgreja%20Batista%20Medaberel!5e1!3m2!1spt-BR!2sbr!4v1771097187841!5m2!1spt-BR!2sbr"
            width="600"
            height="450"
            style="border:0;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
      </header>

      <section class="section">
        <h2 class="section-title">Participe com a gente!</h2>
        <div class="cards">
          <a
            class="card image"
            href="https://drive.google.com/drive/folders/12YqkGTPuifzOPybg1NsjxpRt7zGSfjCY?usp=drive_link"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Abrir pasta no Google Drive"
          >
            <img class="card-media" src="assets/imagem6.jpg" alt="" />
            <div class="card-overlay"></div>
          </a>

          <button
            class="card image video-card"
            type="button"
            data-video-open
            data-video-src="assets/culto-da-familia.mp4?v=20260511"
            aria-label="Assistir video Culto da Familia"
          >
            <img class="card-media" src="assets/imgaem2.jpeg" alt="" />
            <div class="card-overlay pink"></div>
          </button>

          <button
            class="card image video-card"
            type="button"
            data-video-open
            data-video-src="assets/culto-de-provisao.mp4?v=20260511"
            aria-label="Assistir video Culto de Provisao"
          >
            <img class="card-media" src="assets/imagem1.jpg" alt="" />
            <div class="card-overlay"></div>
          </button>

          <article class="card image touch-feedback" data-touch-feedback>
            <img
              class="card-media"
              src="assets/imgaem6.jpeg"
              alt="Circulo de Oracao, toda quinta-feira as 14h"
            />
          </article>

          <button
            class="card image video-card"
            type="button"
            data-video-open
            data-video-src="assets/culto-de-libertacao.mp4?v=20260511"
            aria-label="Assistir video Culto de Libertacao"
          >
            <img class="card-media" src="assets/imgaem3.jpeg" alt="" />
            <div class="card-overlay warm"></div>
          </button>

          <a
            class="card image"
            href="https://drive.google.com/file/d/1AMDHdYdTMmtsYn66ORXh_EakQVyPFWrR/view?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Abrir Escola Biblica Dominical"
            data-dynamic-link="ebd"
          >
            <img class="card-media" src="assets/imagem4.jpg" alt="" />
            <div class="card-overlay"></div>
          </a>

          <a
            class="card image"
            href="https://docs.google.com/forms/d/e/1FAIpQLSd67a-YzwxJQuZfvjxcGTnG2AeqLXNqZuDiLRGG_IKK3gHpnA/viewform?usp=publish-editor"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Abrir formulario"
          >
            <img class="card-media" src="assets/imagem5.jpeg" alt="" />
            <div class="card-overlay"></div>
          </a>

          <a
            class="card image"
            href="eventos.html"
            aria-label="Abrir agenda de eventos dinamica"
          >
            <img
              class="card-media"
              src="assets/agenda_de_eventos.jpeg"
              alt="Agenda de Eventos"
            />
          </a>
        </div>
      </section>

      <section class="section footer-area">
        <a class="pill pill-footer" href="https://form.jotform.com/261173723259055" target="_blank" rel="noopener noreferrer">
          <span class="pill-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="5" width="18" height="14" rx="3" />
              <circle cx="9" cy="12" r="2" />
              <path d="M13 10h6M13 14h6" />
            </svg>
          </span>
          Cadastre-se
        </a>
      </section>

      <section class="section birthdays-section">
        <div class="section-heading">
          <h2 class="section-title">Aniversariantes do Mes</h2>
        </div>
        <p id="birthdaysMessage" class="birthdays-message">
          Carregando aniversariantes...
        </p>
        <ul id="birthdaysList" class="birthdays-list" hidden></ul>
      </section>

    </main>
    <div
      class="video-modal"
      id="videoModal"
      aria-hidden="true"
      hidden
      data-video-close
    >
      <div class="video-shell" role="dialog" aria-modal="true" aria-label="Video Culto de Provisao">
        <button class="video-close" type="button" aria-label="Fechar video" data-video-close>
          Fechar
        </button>
        <video id="cultoVideo" controls playsinline preload="auto">
          <source src="assets/culto-de-provisao.mp4?v=20260511" type="video/mp4" />
          Seu navegador nao conseguiu reproduzir este video.
        </video>
      </div>
    </div>
    <script type="module" src="js/birthdays-public.js"></script>
    <script type="module" src="js/site-links.js"></script>
    <script src="js/video-modal.js?v=20260511"></script>
    <script src="js/tap-feedback.js"></script>

</html>
